site_name: DisasterWorld Documentation
site_description: Setup and use the DisasterWorld survivor-search benchmark
site_url: https://disasterworld.github.io/docs/
docs_dir: docs-src
site_dir: docs
repo_url: https://github.com/DisasterWorld/disasterworld.github.io
edit_uri: edit/main/docs-src/
theme:
  name: material
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features: [navigation.sections, navigation.footer, navigation.top, search.suggest, search.highlight, content.code.copy, toc.follow]
extra_css: [stylesheets/extra.css]
extra:
  social:
    - {icon: material/home, link: '/', name: DisasterWorld project page}
nav:
  - Overview: index.md
  - Getting started:
      - Installation: installation.md
      - Configure and run: configuration.md
  - Benchmark:
      - Dataset bundles: dataset.md
      - Survivor generation: survivors.md
      - Evaluation: evaluation.md
  - Integration and reference:
      - Custom baselines: custom-baselines.md
      - Module integration: modules.md
      - VLM API: vlm-api.md
      - Troubleshooting: troubleshooting.md
markdown_extensions: [admonition, pymdownx.superfences, tables]
